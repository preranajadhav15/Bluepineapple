<!DOCTYPE html>
<html>
<head>
  <title>Jewelry CRUD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>Jewelry Inventory</h2>

<div class="alert alert-info">
Time: <span id="timer"></span>
</div>

<form id="form">
  <input class="form-control mb-2" placeholder="ID (optional)" id="id">
  <input class="form-control mb-2" placeholder="Name" id="name">
  <input class="form-control mb-2" placeholder="Type" id="type">
  <input class="form-control mb-2" placeholder="Price" id="price">
  <button type="button" class="btn btn-primary" onclick="addItem()">Add Item</button>
</form>

<table class="table table-bordered mt-4">
<thead class="table-dark">
<tr>
<th>ID</th>
<th>Name</th>
<th>Type</th>
<th>Price</th>
<th>Action</th>
</tr>
</thead>
<tbody id="table-body"></tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
