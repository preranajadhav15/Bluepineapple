<!DOCTYPE html>
<html>
<head>
    <title>Jewelry CRUD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2 class="mb-3">Jewelry Inventory</h2>

<h5>Current Time: <span id="timer"></span></h5>

<div id="msg" class="alert alert-success d-none mt-3"></div>

<div class="card p-3 mt-3">
    <input id="id" class="form-control mb-2" placeholder="ID">
    <input id="name" class="form-control mb-2" placeholder="Name">
    <input id="type" class="form-control mb-2" placeholder="Type">
    <input id="price" class="form-control mb-2" placeholder="Price">
    <button class="btn btn-primary" onclick="addItem()">Add Item</button>
</div>

<table class="table table-bordered mt-4">
    <thead>
        <tr>
            <th>ID</th><th>Name</th><th>Type</th><th>Price</th><th>Action</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<script>
async function fetchJewelry() {
    const res = await fetch('/api/jewelry/all');
    const data = await res.json();
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    data.forEach(item => {
    tbody.innerHTML += `
    <tr>
        <td>${item.id}</td>
        <td>${item.name}</td>
        <td>${item.type}</td>
        <td>${item.price}</td>
        <td>
            <button class="btn btn-success btn-sm" onclick="editItem('${item.id}')">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deleteItem('${item.id}')">Delete</button>
        </td>
    </tr>`;
    });
}

let editMode = false; // Track if we are editing
let editId = null;    // Store the ID being edited

function editItem(id) {
    const row = Array.from(document.querySelectorAll('#tableBody tr'))
        .find(tr => tr.children[0].innerText === id);

    //Fill form with current data
    document.getElementById('id').value = row.children[0].innerText;
    document.getElementById('name').value = row.children[1].innerText;
    document.getElementById('type').value = row.children[2].innerText;
    document.getElementById('price').value = row.children[3].innerText;

    //Disable editing the ID field
    document.getElementById('id').disabled = true;

    //Change button to Update
    document.querySelector('button[onclick="addItem()"]').innerText = 'Update Item';

    editMode = true;
    editId = id;
}

async function addItem() {
    const idInput = document.getElementById('id');
    const nameInput = document.getElementById('name');
    const typeInput = document.getElementById('type');
    const priceInput = document.getElementById('price');

    const id = idInput.value;
    const name = nameInput.value;
    const type = typeInput.value;
    const price = priceInput.value;

    if (!id || !name || !type || !price) {
        showMsg("Please fill all fields");
        return;
    }

    if (editMode) {
        //Update mode
        const res = await fetch(`/api/jewelry/edit/${editId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `name=${name}&type=${type}&price=${price}`
        });

        const text = await res.text();
        showMsg(text);

        //Reset form
        editMode = false;
        editId = null;
        idInput.disabled = false;
        document.querySelector('button[onclick="addItem()"]').innerText = 'Add Item';
    } else {
        //Add mode
        const res = await fetch('/api/jewelry/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `id=${id}&name=${name}&type=${type}&price=${price}`
        });

        const text = await res.text();
        showMsg(text);
    }

    // Clear form
    idInput.value = '';
    nameInput.value = '';
    typeInput.value = '';
    priceInput.value = '';

    fetchJewelry();
}


async function deleteItem(id) {
    const res = await fetch(`/api/jewelry/delete/${id}`, { method: 'DELETE' });
    const text = await res.text();
    showMsg(text);
    fetchJewelry();
}

function showMsg(text) {
    const msg = document.getElementById('msg');
    msg.innerText = text;
    msg.classList.remove('d-none');
    setTimeout(() => msg.classList.add('d-none'), 3000);
}

async function updateTime() {
    const res = await fetch('/api/time');
    const data = await res.json();
    document.getElementById('timer').innerText = data.time;
}

fetchJewelry();
setInterval(fetchJewelry, 5000);
setInterval(updateTime, 1000);
</script>

</body>
</html>
