<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Structure & Basic CSS</title>
    <!-- External CSS: CSS written in a separate file i.e .css file and linked using <link>.-->
    <link rel="stylesheet" href="Assignment_1.css">
</head>
<body>
    <h1>This is Heanding 1</h1>
    <h2>This is Heanding 2</h2>
    <h3>This is Heanding 3</h3>
    <h4>This is Heanding 4</h4>
    <h5>This is Heanding 5</h5>
    <h6>This is Heanding 6</h6>

    <p>This is the assignment of HTML Structure & Basic CSS</p>
    <!-- Internal CSS: CSS written inside <style> tag in the HTML file.
        <style>
            body { background-color:pink;
            }
        </style>-->
    
    <!-- Inline CSS: CSS written directly inside the Html element.
        <p style="color: red;">
            This paragraph uses inline CSS.
        </p>-->
</body>
</html>
